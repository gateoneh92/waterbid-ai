name: 파주 상하수도 공고 자동 수집

on:
  schedule:
    # 평일 오전 9시, 오후 2시 자동 실행 (UTC 00:00, 05:00 = 한국시간 09:00, 14:00)
    - cron: '0 0,5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-bids:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 나라장터 공고 수집 실행
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python fetch_paju_bids.py

      - name: 수집 결과(paju_bids.json) 커밋 및 배포 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paju_bids.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 파주 상하수도 공고 데이터 업데이트" && git push)
